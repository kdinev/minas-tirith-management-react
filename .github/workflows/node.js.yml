# Pull-request checks. Pushes to master are checked by the deploy workflow's own
# build job, so this runs on pull requests only rather than duplicating it.
name: Node.js CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # See the supported Node.js release schedule at
        # https://nodejs.org/en/about/releases/
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so this covers the type-check.
      - name: Build
        run: npm run build

      # The component tests run in a real Chromium via @vitest/browser-playwright.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test -- --run
        env:
          CI: 'true'
